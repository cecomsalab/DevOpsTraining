# Step 5: env levels, repository variables, secrets, and step outputs.
# Create first: variable PREFIX and secret DEMO_SECRET (Settings > Secrets and variables > Actions).
name: 05 Variables and secrets

on:
  workflow_dispatch:

env:
  COURSE: devops                     # workflow level: every job

jobs:
  values:
    runs-on: ubuntu-latest
    env:
      MODULE: "06"                   # job level: every step of this job
    steps:
      - name: Read the three env levels
        env:
          STEP_NOTE: step level      # step level: only this step
        run: echo "$COURSE / $MODULE / $STEP_NOTE"

      - name: Read a repository variable (vars context)
        env:
          PREFIX: ${{ vars.PREFIX }}
        run: echo "Prefix is $PREFIX"

      - name: Read a secret (always masked in the log)
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "The secret is: $DEMO_SECRET"
          echo "Length: ${#DEMO_SECRET} characters"

      - name: Pass a value to later steps
        id: calc
        run: |
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Use the values
        env:
          RESULT: ${{ steps.calc.outputs.result }}
        run: echo "Build date $BUILD_DATE, result $RESULT"
